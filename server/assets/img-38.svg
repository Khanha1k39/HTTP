<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad38" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C7CEEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C7CEEACC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow38">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="16" fill="url(#grad38)"/>
  
  <!-- Pattern -->
  <circle cx="90" cy="90" r="80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="90" cy="90" r="65" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Number badge -->
  <circle cx="160" cy="20" r="14" fill="rgba(0,0,0,0.3)" filter="url(#shadow38)"/>
  <text x="160" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">38</text>
  
  <!-- Icon (as text) -->
  <text x="90" y="95" font-size="60" text-anchor="middle" dominant-baseline="middle">🍄</text>
  
  <!-- Label -->
  <text x="90" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="500"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">img-38</text>
</svg>

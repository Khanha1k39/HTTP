<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85C1E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#85C1E9CC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow10">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="16" fill="url(#grad10)"/>
  
  <!-- Pattern -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="60" cy="60" r="35" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Number badge -->
  <circle cx="100" cy="20" r="14" fill="rgba(0,0,0,0.3)" filter="url(#shadow10)"/>
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">10</text>
  
  <!-- Icon (as text) -->
  <text x="60" y="65" font-size="40" text-anchor="middle" dominant-baseline="middle">💎</text>
  
  <!-- Label -->
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="500"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">img-10</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="grad97" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888CC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow97">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="160" height="160" rx="16" fill="url(#grad97)"/>
  
  <!-- Pattern -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="80" cy="80" r="55" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Number badge -->
  <circle cx="140" cy="20" r="14" fill="rgba(0,0,0,0.3)" filter="url(#shadow97)"/>
  <text x="140" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">97</text>
  
  <!-- Icon (as text) -->
  <text x="80" y="85" font-size="53.333333333333336" text-anchor="middle" dominant-baseline="middle">⚫</text>
  
  <!-- Label -->
  <text x="80" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="500"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">img-97</text>
</svg>

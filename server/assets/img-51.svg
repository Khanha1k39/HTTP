<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="grad51" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0C4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0C4FFCC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow51">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="140" height="140" rx="16" fill="url(#grad51)"/>
  
  <!-- Pattern -->
  <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="70" cy="70" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Number badge -->
  <circle cx="120" cy="20" r="14" fill="rgba(0,0,0,0.3)" filter="url(#shadow51)"/>
  <text x="120" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="white" text-anchor="middle">51</text>
  
  <!-- Icon (as text) -->
  <text x="70" y="75" font-size="46.666666666666664" text-anchor="middle" dominant-baseline="middle">🚂</text>
  
  <!-- Label -->
  <text x="70" y="128" font-family="Arial, sans-serif" font-size="11" font-weight="500"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">img-51</text>
</svg>
